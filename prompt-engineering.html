<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="How I used Prompt Engineering to design my personal portfolio" />
  <title>Prompt Engineering Process · 卢沁园</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎯</text></svg>" />
  <style>
    /* ===== 本页专属排版：Interactive Brainstorming Case Study ===== */

    /* 轻微入场动画（reduced-motion 下自动关闭） */
    @keyframes peFade {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    /* Brain Storming 标签专属入场：保持 -4deg 旋转 */
    @keyframes peTagIn {
      from { opacity: 0; transform: rotate(-7deg) translateY(12px); }
      to   { opacity: 1; transform: rotate(-4deg); }
    }

    .pe-anim {
      opacity: 0;
      animation: peFade .9s var(--ease) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .pe-anim, .pe-tag { opacity: 1; animation: none; }
    }

    /* ---- Statement 区（紧凑，不占 Hero 大部分空间） ---- */
    .pe-statement {
      position: relative;            /* 容纳右上角 Brain Storming 标签 */
      padding: clamp(110px, 12vw, 170px) 0 clamp(40px, 5vw, 70px);
    }

    .pe-kicker {
      font-size: .72rem;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.8rem;
    }

    .pe-stmt {
      font-family: var(--sans);
      font-weight: 700;
      font-size: clamp(2rem, 4.6vw, 3.4rem);
      line-height: 1.22;
      letter-spacing: -.01em;
      max-width: 15em;
    }

    .pe-stmt em {
      font-family: var(--serif);
      font-style: italic;
      color: var(--accent);
      font-weight: 400;
    }

    /* ---- 右上角 Brain Storming 视觉标签（约 1/8 页面面积） ---- */
    .pe-tag {
      position: absolute;
      top: clamp(96px, 13vh, 150px);
      right: clamp(20px, 5vw, 64px);
      background: var(--accent);
      color: var(--bg);
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.7rem, 3.6vw, 2.5rem);
      line-height: 1.15;
      letter-spacing: .01em;
      text-align: center;
      padding: clamp(1rem, 2.2vw, 1.6rem) clamp(1.2rem, 2.4vw, 1.8rem);
      width: clamp(200px, 16vw, 300px);
      transform: rotate(-4deg);
      animation: peTagIn .9s var(--ease) .25s forwards;
    }

    @media (max-width: 760px) {
      .pe-tag {
        position: static;
        margin: 0 0 2.4rem auto;
        width: clamp(180px, 46vw, 240px);
      }
    }

    /* ---- 主体：左 Question / 右 My Thinking ---- */
    .pe-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(3rem, 7vw, 8rem);
      padding: clamp(80px, 9vw, 130px) 0 clamp(120px, 12vw, 190px);
    }

    .pe-col-tag {
      display: flex;
      align-items: center;
      gap: .9rem;
      font-size: .78rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2.4rem;
    }

    .pe-col-tag::before {
      content: "";
      width: 2.4rem;
      height: 1px;
      background: var(--accent);
      flex: none;
    }

    .pe-col-tag small {
      font-size: .7rem;
      letter-spacing: .2em;
      color: var(--ink-3);
    }

    .pe-col-body {
      min-height: 42vh;             /* 留白：具体问题内容稍后填充 */
    }

    @media (max-width: 760px) {
      .pe-cols { grid-template-columns: 1fr; }
      .pe-col-body { min-height: 30vh; }
    }

    /* ===== 动态叙事：Question 便签 / 打字机 / Insight ===== */
    .pe-q-note {
      display: inline-block;
      position: relative;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      box-shadow: 0 14px 34px rgba(35, 42, 34, .07);
      padding: 1.5rem 1.7rem;
      font-size: clamp(1.05rem, 1.8vw, 1.28rem);
      font-weight: 500;
      line-height: 1.65;
      color: var(--ink);
      opacity: 0;
      transform: translateX(-46px) rotate(-1.5deg);
      transition: opacity .55s var(--ease), transform .6s cubic-bezier(.34, 1.56, .64, 1);
    }

    .pe-q-note::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
    }

    .pe-q-note.in {
      opacity: 1;
      transform: translateX(0) rotate(-1.5deg);
    }

    .pe-think {
      font-size: clamp(1rem, 1.7vw, 1.16rem);
      line-height: 2;
      color: var(--ink-2);
      min-height: 4.6em;
      white-space: pre-wrap;
    }

    .pe-think::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1.05em;
      background: var(--accent);
      margin-left: 3px;
      vertical-align: -0.12em;
      animation: caretBlink 1s steps(2, start) infinite;
    }

    .pe-think.done::after { display: none; }

    @keyframes caretBlink { to { visibility: hidden; } }

    .pe-insight {
      margin-top: 2.8rem;
      border-left: 3px solid var(--accent);
      background: rgba(74, 110, 88, .07);
      padding: 1.4rem 1.6rem;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .7s var(--ease), transform .7s var(--ease);
    }

    .pe-insight.show { opacity: 1; transform: none; }

    .pe-insight-label {
      display: block;
      font-size: .68rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: .6rem;
    }

    .pe-insight-text {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.02rem, 1.8vw, 1.2rem);
      line-height: 1.7;
      color: var(--ink);
    }

    .pe-control {
      margin-top: 2.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      opacity: 0;
      transition: opacity .5s var(--ease);
    }

    .pe-control.show { opacity: 1; }

    .pe-progress {
      font-size: .78rem;
      letter-spacing: .24em;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    @media (prefers-reduced-motion: reduce) {
      .pe-q-note, .pe-insight, .pe-control {
        opacity: 1;
        transform: none;
        transition: none;
      }
      .pe-think::after { animation: none; }
    }
  </style>
</head>
<body>

  <header class="nav" id="nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo">卢沁园<span class="nav-logo-dot">.</span></a>
      <nav class="nav-links">
        <a href="index.html">返回主页</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- Statement + 右上角 Brain Storming 标签 -->
    <section class="pe-statement">
      <div class="container">
        <p class="pe-kicker pe-anim">Interactive Brainstorming Case Study</p>
        <h1 class="pe-stmt pe-anim" style="animation-delay:.12s">The website is my project of <em>Prompt Engineering</em></h1>
      </div>
      <div class="pe-tag" aria-hidden="true">Brain Storming</div>
    </section>

    <!-- 主体：Question / My Thinking -->
    <section class="pe-body">
      <div class="container pe-cols">
        <div class="pe-col pe-q">
          <p class="pe-col-tag pe-anim" style="animation-delay:.2s">Question <small>01</small></p>
          <div class="pe-col-body">
            <div class="pe-q-note" aria-live="polite"></div>
          </div>
        </div>
        <div class="pe-col pe-t">
          <p class="pe-col-tag pe-anim" style="animation-delay:.26s">My Thinking <small>02</small></p>
          <div class="pe-col-body">
            <div class="pe-think" aria-live="polite"></div>
            <div class="pe-insight" aria-hidden="true">
              <span class="pe-insight-label">Insight</span>
              <p class="pe-insight-text"></p>
            </div>
            <div class="pe-control">
              <span class="pe-progress">01 / 07</span>
              <button class="pe-next btn btn-ghost" type="button">Next Question</button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
  (function () {
    'use strict';

    var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Brain Storming 内容：Question → Thinking（逐字）→ Insight（产品判断） */
    var steps = [
      {
        q: 'Why did I redesign my portfolio?',
        thinking: [
          '传统 PDF Portfolio 可以展示我的经历，',
          '但是无法完整表达：我如何思考、如何设计、如何解决问题。',
          '我希望作品集不仅展示结果，也展示过程。'
        ],
        insight: 'A portfolio should show how I think, not only what I built.'
      },
      {
        q: 'What should this website actually solve?',
        thinking: [
          '如果只是做一个漂亮网页，',
          '它仍然只是一个展示页面。',
          '我希望它成为一个产品：展示我的项目经历、设计审美、产品思维，以及 AI 协作方式。'
        ],
        insight: 'A portfolio can become an interactive product experience.'
      },
      {
        q: 'How can AI understand my design taste?',
        thinking: [
          'AI 不知道什么叫高级设计。',
          '所以我不能只告诉 AI："Create a beautiful website"。',
          '我需要提供：参考案例、设计原则、目标、限制条件。'
        ],
        insight: 'Better context creates better collaboration.'
      },
      {
        q: 'How do I collaborate with AI?',
        thinking: [
          '我没有把 AI 当作代码生成工具。',
          '而是在不同阶段赋予 AI 不同角色：',
          'Product Designer',
          'Frontend Engineer',
          'UX Reviewer'
        ],
        insight: 'AI becomes a design partner, not only a generation tool.'
      },
      {
        q: 'Why does the first AI output often feel wrong?',
        thinking: [
          '第一次生成只是起点。',
          'AI 输出需要人工评估。',
          '找到：哪里不像我的目标？为什么不符合预期？',
          '然后重新优化 Prompt。'
        ],
        insight: 'Prompt Engineering is an iterative process.'
      },
      {
        q: 'How do I know whether my prompt works?',
        thinking: [
          '我的方法：每次修改功能前，先生成一个样本。',
          '通过样本判断：Prompt 是否准确表达需求。'
        ],
        insight: 'Evaluate before you optimize.'
      },
      {
        q: 'What changed after iterations?',
        thinking: [
          '最大的变化不是网页变漂亮。',
          '而是：AI 从一个生成工具，变成我的设计协作者。'
        ],
        insight: 'Human judgment + AI generation creates better products.'
      }
    ];

    var note = document.querySelector('.pe-q-note');
    var think = document.querySelector('.pe-think');
    var insight = document.querySelector('.pe-insight');
    var insightText = document.querySelector('.pe-insight-text');
    var progress = document.querySelector('.pe-progress');
    var control = document.querySelector('.pe-control');
    var nextBtn = document.querySelector('.pe-next');

    var idx = 0;
    var busy = false;

    function pad(n) { return (n < 10 ? '0' : '') + n; }

    function showInsight(text) {
      insightText.textContent = text;
      insight.setAttribute('aria-hidden', 'false');
      insight.classList.add('show');
    }

    /* 打字机：逐字显示多行思考，句间自然停顿 */
    function typeLines(lines, done) {
      think.textContent = '';
      think.classList.remove('done');
      var li = 0, ci = 0;
      function tick() {
        if (li >= lines.length) {
          think.classList.add('done');
          done();
          return;
        }
        var line = lines[li];
        if (ci < line.length) {
          ci++;
          think.textContent = lines.slice(0, li).join('') + line.slice(0, ci);
          setTimeout(tick, prefersReduced ? 0 : 42);
        } else {
          li++;
          ci = 0;
          think.textContent = lines.slice(0, li).join('');
          setTimeout(tick, prefersReduced ? 0 : 480);
        }
      }
      tick();
    }

    function render() {
      var step = steps[idx];
      busy = true;

      progress.textContent = pad(idx + 1) + ' / ' + pad(steps.length);

      /* Step 1：Question 便签从左侧滑入 */
      note.textContent = step.q;
      note.classList.remove('in');
      void note.offsetWidth;
      note.classList.add('in');

      /* 重置右侧 */
      think.textContent = '';
      think.classList.remove('done');
      insight.classList.remove('show');
      insight.setAttribute('aria-hidden', 'true');
      control.classList.remove('show');

      nextBtn.textContent = (idx + 1 < steps.length) ? 'Next Question' : 'That\u2019s the process';
      nextBtn.classList.toggle('is-last', idx + 1 >= steps.length);

      /* Step 2：停留片刻 → Step 3：逐字思考 → Step 4：Insight 出现 */
      setTimeout(function () {
        typeLines(step.thinking, function () {
          setTimeout(function () {
            showInsight(step.insight);
            setTimeout(function () {
              control.classList.add('show');
              busy = false;
            }, prefersReduced ? 40 : 520);
          }, prefersReduced ? 40 : 260);
        });
      }, prefersReduced ? 60 : 1150);
    }

    nextBtn.addEventListener('click', function () {
      if (busy) return;
      if (idx + 1 < steps.length) {
        idx++;
        render();
      } else {
        window.scrollTo({ top: 0, behavior: prefersReduced ? 'auto' : 'smooth' });
      }
    });

    render();
  })();
  </script>

</body>
</html>
